name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: jest (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    # A real, throwaway PostgreSQL 16 per shard. No mocks, no shared database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pour
          POSTGRES_PASSWORD: pour
          POSTGRES_DB: pour_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pour -d pour_ledger_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      # Throwaway CI database on the runner itself. Not a secret.
      DATABASE_URL: postgres://pour:pour@127.0.0.1:5432/pour_ledger_test
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Steps start only after the service health check passes.
      - name: Migrate (a broken migration fails here, not inside a test)
        run: npm run db:migrate

      - name: Jest shard ${{ matrix.shard }}/2
        # Each test file creates its own schema, runs the migrations into it and
        # drops it afterwards, so files and shards never share rows.
        run: npx jest --ci --shard=${{ matrix.shard }}/2

  # Single required check for branch protection.
  ci-ok:
    name: ci ok
    if: always()
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: All shards passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test result: ${{ needs.test.result }}" >&2
            exit 1
          fi
